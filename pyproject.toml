[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-transcriber"
version = "0.1.0"
description = "Story Text, Reading Order & Speaker Attribution for Three-Page Manga Sequences"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "opencv-python-headless>=4.8.0",
    "rapidfuzz>=3.5.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "onnxruntime>=1.16.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pytesseract>=0.3.10",
    "huggingface-hub>=0.20.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
